services:
  app:
    image: ghcr.io/tschuba/on-duty:${APP_VERSION:-latest}
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onduty}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-onduty}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # volumes:
    #   - ./backups:/app/backups  # wenn BACKUP_LOCAL_PATH=/app/backups gesetzt

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onduty}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-onduty}
    volumes:
      - onduty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onduty} -d ${POSTGRES_DB:-onduty}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  onduty_pgdata:
