services:
  app:
    image: ghcr.io/tschuba/on-duty:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onduty}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-onduty}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # volumes:
    #   - ./backups:/app/backups  # wenn BACKUP_LOCAL_PATH=/app/backups gesetzt

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onduty}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-onduty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onduty}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
