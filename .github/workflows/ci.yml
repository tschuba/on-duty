name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  coverage-baseline:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-master
          path: coverage/coverage-summary.json
          overwrite: true

  coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      # download-artifact defaults to the current run; coverage-master was
      # uploaded in master's push run, so resolve that run's id explicitly.
      - uses: actions/github-script@v7
        id: baseline-run
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'master',
              event: 'push',
              status: 'success',
              per_page: 1,
            })
            return data.workflow_runs[0]?.id ?? ''
      - uses: actions/download-artifact@v4
        if: steps.baseline-run.outputs.result != ''
        continue-on-error: true
        with:
          name: coverage-master
          path: coverage-master/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.baseline-run.outputs.result }}
      - run: node scripts/post-coverage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
