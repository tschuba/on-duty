name: PR Title & Version Bump

# Validates Conventional Commits PR titles and bumps package.json on the PR
# branch when the diff touches build-affecting files. Needs RELEASE_TOKEN
# (PAT, Contents rw) in Actions AND Dependabot secrets so the bump push
# retriggers checks. Fork PRs can't be pushed to (single-repo: not relevant).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [master]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.lint.outputs.type }}
    steps:
      - id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            chore
            docs
            test
            ci
            style
            build
            refactor
            revert

  bump-version:
    name: Bump Version
    needs: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Fetch base
        run: git fetch origin master

      - name: Compute and apply bump
        env:
          TYPE: ${{ needs.pr-title.outputs.type }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Bump level from PR title/body: none|patch|minor|major
          bump_level() {
            local type="$1" title="$2" body="$3"
            if [[ "$title" =~ ^[a-z]+(\([^\)]*\))?!: ]] || [[ "$body" == *"BREAKING CHANGE"* ]]; then echo major; return; fi
            case "$type" in
              feat) echo minor ;;
              fix|perf) echo patch ;;
              *) echo none ;;
            esac
          }

          # next_version <base> <level>
          next_version() {
            local IFS=.; read -r ma mi pa <<<"$1"
            case "$2" in
              major) echo "$((ma+1)).0.0" ;;
              minor) echo "$ma.$((mi+1)).0" ;;
              patch) echo "$ma.$mi.$((pa+1))" ;;
            esac
          }

          # Self-check
          [ "$(next_version 0.4.2 patch)" = 0.4.3 ] && [ "$(next_version 0.4.2 minor)" = 0.5.0 ] && [ "$(next_version 0.4.2 major)" = 1.0.0 ]
          [ "$(bump_level feat 'feat!: x' '')" = major ] && [ "$(bump_level fix 'fix: x' '')" = patch ]

          FILTER=(src/ drizzle/ public/
            package.json pnpm-lock.yaml pnpm-workspace.yaml
            Dockerfile tsup.config.ts drizzle.config.ts
            scripts/zitadel-init.mjs scripts/copy-fonts.mjs scripts/copy-htmx.mjs branding/)

          # Ignore our own bump commit's package.json change by diffing without it only if nothing else matches
          changed=$(git diff --name-only origin/master...HEAD -- "${FILTER[@]}")
          if [ -z "$changed" ]; then echo "No build-affecting changes, no bump."; exit 0; fi

          level=$(bump_level "$TYPE" "$TITLE" "$BODY")
          if [ "$level" = none ]; then
            echo "::error::Build-affecting files changed; PR title must use fix, feat or perf (or ! for breaking)."
            echo "$changed"
            exit 1
          fi

          base=$(git show origin/master:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          new=$(next_version "$base" "$level")
          cur=$(node -p 'require("./package.json").version')
          if [ "$cur" = "$new" ]; then echo "Already at $new."; exit 0; fi

          npm pkg set version="$new"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $new"
          git push
