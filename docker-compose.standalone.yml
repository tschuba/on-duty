services:
  app:
    image: ghcr.io/tschuba/on-duty:${APP_VERSION:-latest}
    # node runs as PID 1 here without its own SIGTERM handler — without init
    # PID 1 ignores the signal (Linux special case), so `stop`/`down` would wait
    # for the full grace timeout and then send SIGKILL (exit 137).
    init: true
    restart: on-failure
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      SERVICE_FQDN_APP_3000:
      DATABASE_URL: postgres://${POSTGRES_USER:-onduty}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-onduty}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_BETTERAUTH}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      # Required (`:?` without text: Coolify would take the text as the default value). Zitadel fixes the org name on first start.
      ORG_NAME: ${ORG_NAME:?}
      OIDC_PROVIDER: https://${SERVICE_FQDN_ZITADEL}
      # Empty = created automatically by zitadel-init (oidc.env in the bootstrap volume).
      # Explicit values in .env.standalone take precedence (e.g. existing installations).
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Signing secret of the Zitadel webhook; zitadel-init-hooks only creates it AFTER app has started,
      # so on-duty reads the file at runtime (empty/missing = webhook inactive).
      ZITADEL_WEBHOOK_SECRET_FILE: /zitadel/bootstrap/webhook.secret
      OIDC_APP_URL: https://${SERVICE_FQDN_APP}
      # Optional error reporting (Sentry protocol: Bugsink, GlitchTip, Sentry). Empty = off.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Written by bugsink-init (profile `errors`); missing file = off. Needs one app restart after the first run.
      SENTRY_DSN_FILE: ${SENTRY_DSN_FILE:-/bugsink/dsn}
      # Link shown in /admin/config; defaults to the Bugsink issue list, empty when the `errors` profile is off.
      ERROR_TRACKER_URL: ${ERROR_TRACKER_URL:-${SERVICE_FQDN_BUGSINK:+https://${SERVICE_FQDN_BUGSINK}/issues/}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # The built-in backup mechanism is disabled in the standalone stack — the
      # dedicated `backup` service below backs up both databases instead.
      # See 17_Backup-Status-Flag (separate task): hard-wired, no placeholder
      # in .env.standalone since toggling it never makes sense here.
      BACKUP_DISABLED: "true"
      # One-time start values for the registration settings (only applied while unset in the DB).
      # Role ID = built-in role "Leser" (src/db/seed.ts).
      REGISTRATION_ENABLED: "true"
      REGISTRATION_AUTO_APPROVE: "false"
      REGISTRATION_DEFAULT_ROLE_ID: 7c3d5e6f-8a9b-4c1d-8e2f-3a4b5c6d7e8f
    command:
      - sh
      - -c
      - '[ -n "$$OIDC_CLIENT_ID" ] || . /zitadel/bootstrap/oidc.env; export OIDC_CLIENT_ID OIDC_CLIENT_SECRET; exec node dist/entrypoint.js'
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
      - bugsink-bootstrap:/bugsink:ro
    depends_on:
      db:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully

  # Optional error tracker (compose profile `errors`, off by default): `COMPOSE_PROFILES=errors`.
  # SQLite in its own volume, NOT backed up.
  bugsink:
    image: bugsink/bugsink:2.6
    profiles: [errors]
    restart: unless-stopped
    environment:
      SERVICE_FQDN_BUGSINK_8000:
      SECRET_KEY: ${SERVICE_PASSWORD_64_BUGSINKSECRET}
      BASE_URL: https://${SERVICE_FQDN_BUGSINK}
      BEHIND_HTTPS_PROXY: "True"
      CREATE_SUPERUSER: ${BUGSINK_ADMIN_EMAIL:-admin@bugsink.local}:${SERVICE_PASSWORD_BUGSINK}
      # Limits (docs defaults: 5000/h per project); retention per project is set by bugsink-init.
      MAX_EVENTS_PER_PROJECT_PER_HOUR: ${BUGSINK_MAX_EVENTS_PER_HOUR:-1000}
      # Mail (password resets) from the same SMTP_* values as the app. Empty SMTP_HOST = Bugsink sends nothing.
      # STARTTLS (587) is the default like in the app; for port 465 set BUGSINK_EMAIL_USE_SSL=True and BUGSINK_EMAIL_USE_TLS=False.
      EMAIL_HOST: ${SMTP_HOST:-}
      EMAIL_PORT: ${SMTP_PORT:-587}
      EMAIL_HOST_USER: ${SMTP_USER:-}
      EMAIL_HOST_PASSWORD: ${SMTP_PASS:-}
      EMAIL_USE_TLS: ${BUGSINK_EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${BUGSINK_EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${SMTP_FROM:-}
    volumes:
      - bugsink-data:/data

  # One-shot: creates team + project once and writes the DSN to the bootstrap volume (idempotent).
  bugsink-init:
    image: bugsink/bugsink:2.6
    profiles: [errors]
    restart: "no"
    user: "0" # writes the DSN into the bugsink-bootstrap volume (root-owned by default)
    environment:
      SECRET_KEY: ${SERVICE_PASSWORD_64_BUGSINKSECRET}
      BASE_URL: https://${SERVICE_FQDN_BUGSINK}
      BUGSINK_HOST: ${SERVICE_FQDN_BUGSINK}
      BUGSINK_RETENTION_EVENTS: ${BUGSINK_RETENTION_EVENTS:-10000}
    volumes:
      - bugsink-data:/data
      - bugsink-bootstrap:/bugsink:rw
    depends_on:
      - bugsink
    entrypoint: ["python", "-c"]
    command:
      - |
        import json, os, subprocess, sys, time, urllib.error, urllib.request
        OUT = "/bugsink/dsn"
        if os.path.exists(OUT) and os.path.getsize(OUT):
            print("[bugsink-init] DSN exists, nothing to do."); sys.exit(0)
        # Bugsink migrates the shared SQLite DB on start; only create the token once it answers.
        for _ in range(90):
            try: urllib.request.urlopen(urllib.request.Request("http://bugsink:8000/", headers={"Host": os.environ["BUGSINK_HOST"]}), timeout=5); break
            except urllib.error.HTTPError: break
            except Exception as e: err = e; time.sleep(2)
        else: sys.exit("[bugsink-init] Bugsink not reachable: %s" % err)
        token = subprocess.run(["bugsink-manage", "create_auth_token"], check=True, capture_output=True, text=True).stdout.strip().splitlines()[-1]
        def api(method, path, body=None):
            req = urllib.request.Request("http://bugsink:8000/api/canonical/0/" + path, method=method,
                data=json.dumps(body).encode() if body else None,
                headers={"Authorization": "Bearer " + token, "Content-Type": "application/json", "Host": os.environ["BUGSINK_HOST"]})
            with urllib.request.urlopen(req, timeout=10) as r:
                return json.load(r)
        def items(x): return x["results"] if isinstance(x, dict) else x
        for _ in range(60):
            try: teams = items(api("GET", "teams/")); break
            except Exception as e: err = e; time.sleep(2)
        else: sys.exit("[bugsink-init] Bugsink not reachable: %s" % err)
        team = teams[0] if teams else api("POST", "teams/", {"name": "on-duty"})
        project = next((p for p in items(api("GET", "projects/")) if p["name"] == "on-duty"), None)
        if not project:
            project = api("POST", "projects/", {"team": team["id"], "name": "on-duty", "retention_max_event_count": int(os.environ["BUGSINK_RETENTION_EVENTS"])})
        dsn = api("GET", "projects/%s/" % project["id"])["dsn"]
        open(OUT, "w").write(dsn)
        print("[bugsink-init] DSN written. Restart the app once.")

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onduty}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-onduty}
      ZITADEL_DB_NAME: ${ZITADEL_DB_NAME:-zitadel}
      ZITADEL_DB_USER: ${ZITADEL_DB_USER:-zitadel}
      ZITADEL_DB_PASSWORD: ${SERVICE_PASSWORD_ZITADELDB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init script via Docker `configs` (inline) instead of a bind mount: Coolify creates relative
      # bind mounts as an empty directory ("Is a directory").
    configs:
      - source: init-zitadel-db
        target: /docker-entrypoint-initdb.d/init-zitadel-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onduty} -d ${POSTGRES_DB:-onduty}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.2
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkeyFromEnv
    environment:
      SERVICE_FQDN_ZITADEL_8080:
      ZITADEL_MASTERKEY: ${SERVICE_PASSWORD_ZITADELMASTER}
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${SERVICE_FQDN_ZITADEL}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      # The reverse proxy (Coolify/Traefik, locally Caddy) terminates TLS and
      # talks to Zitadel internally via h2c (cleartext HTTP/2).
      ZITADEL_TLS_ENABLED: "false"
      # Dedicated, unprivileged DB user (see configs: init-zitadel-db below)
      # instead of the onduty superuser — with a DSN set, Zitadel does not create
      # its own user but uses exactly the one given here.
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${ZITADEL_DB_USER:-zitadel}:${SERVICE_PASSWORD_ZITADELDB}@db:5432/${ZITADEL_DB_NAME:-zitadel}?sslmode=disable
      # Erstinstanz-Bootstrap: nur Org + Admin-User. Projekt/OIDC-Application
      # entstehen NICHT automatisch — siehe docs/standalone-deployment.md.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ORG_NAME:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      # Fixed suffix guarantees upper/lower case, digit and symbol: the random Coolify value alone sometimes
      # misses one class and the first setup then fails in a retry loop (PasswordComplexityPolicy).
      # So the initial password is NOT the Coolify value alone: it is the value shown in Coolify + "Aa1!".
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${SERVICE_PASSWORDWITHSYMBOLS_ZITADELADMIN}Aa1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      # Login V2 (separate zitadel-login container) needs a machine user
      # with a PAT, which Zitadel creates itself during bootstrap and shares
      # with zitadel-login via the common zitadel-bootstrap volume.
      # Admin machine user (IAM_OWNER) for zitadel-init only: creates project + OIDC app on first start and keeps
      # redirect URIs, login URL and webhook in sync with the domains on every deploy. Its PAT lives in the separate
      # zitadel-admin volume, mounted only by zitadel and the init containers. Only created during the very first
      # setup of the instance.
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/admin/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: onduty-init
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: on-duty init (domain sync)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${SERVICE_FQDN_ZITADELLOGIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${SERVICE_FQDN_ZITADELLOGIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${SERVICE_FQDN_ZITADELLOGIN}/ui/v2/login/logout?post_logout_redirect=
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
      - zitadel-admin:/zitadel/admin:rw
    depends_on:
      db:
        condition: service_healthy

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.19.2
    restart: unless-stopped
    user: "0"
    environment:
      # Own domain WITHOUT a path: otherwise Coolify strips the path prefix (Traefik stripprefix),
      # but the login UI needs it (NEXT_PUBLIC_BASE_PATH).
      SERVICE_FQDN_ZITADELLOGIN_3000:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${SERVICE_PASSWORD_ZITADELCOOKIE}
      # Without this, Login V2 creates the user on registration but never sends the
      # verification code (apps/login/src/lib/verify-helper.ts checkEmailVerification),
      # leaving the user stuck until they hit "Resend code" manually.
      EMAIL_VERIFICATION: "true"
      CUSTOM_REQUEST_HEADERS: Host:${SERVICE_FQDN_ZITADEL},x-zitadel-instance-host:${SERVICE_FQDN_ZITADEL},x-zitadel-public-host:${SERVICE_FQDN_ZITADEL},X-Forwarded-Proto:https
    # ponytail: CSP copied from zitadel-login:v4.19.2, compare on image update. The login app lives on its own
    # domain, so branding logo/font served from the Zitadel domain are blocked unless img-src/font-src allow it.
    # Coolify's generated router can't be extended by name, so a higher-priority https router carries the middleware.
    labels:
      - traefik.enable=true
      - "traefik.http.middlewares.zitadel-login-csp.headers.customresponseheaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' http://zitadel:8080 https://${SERVICE_FQDN_ZITADEL}; img-src 'self' http://zitadel:8080 https://${SERVICE_FQDN_ZITADEL}; frame-ancestors 'none'; object-src 'none'"
      - traefik.http.routers.zitadel-login-csp.rule=Host(`${SERVICE_FQDN_ZITADELLOGIN}`)
      - traefik.http.routers.zitadel-login-csp.entryPoints=https
      - traefik.http.routers.zitadel-login-csp.priority=1000
      - traefik.http.routers.zitadel-login-csp.tls=true
      - traefik.http.routers.zitadel-login-csp.tls.certresolver=letsencrypt
      - traefik.http.routers.zitadel-login-csp.middlewares=gzip-sse,zitadel-login-csp
      - traefik.http.routers.zitadel-login-csp.service=zitadel-login-csp
      - traefik.http.services.zitadel-login-csp.loadbalancer.server.port=3000
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy

  # One-shot init: after the first Zitadel setup, creates project + OIDC app (client id/secret ->
  # bootstrap volume, read by the app service). Uses the on-duty image (Node), no extra image.
  zitadel-init:
    image: ghcr.io/tschuba/on-duty:${APP_VERSION:-latest}
    restart: "no"
    command: ["node", "scripts/zitadel-init.mjs", "oidc"]
    environment:
      ZITADEL_DOMAIN: ${SERVICE_FQDN_ZITADEL}
      APP_DOMAIN: ${SERVICE_FQDN_APP}
      LOGIN_DOMAIN: ${SERVICE_FQDN_ZITADELLOGIN}
      ORG_NAME: ${ORG_NAME:?}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      # Same SMTP values as for on-duty — kept in sync in Zitadel on every run.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
      - zitadel-admin:/zitadel/admin:ro
    depends_on:
      zitadel:
        condition: service_healthy

  # Setup phase 2: create the webhook target once app is running (Zitadel resolves the host on creation),
  # then remove the bootstrap machine user. Optional — if this fails, on-duty still works.
  zitadel-init-hooks:
    image: ghcr.io/tschuba/on-duty:${APP_VERSION:-latest}
    restart: "no"
    command: ["node", "scripts/zitadel-init.mjs", "hooks"]
    environment:
      ZITADEL_DOMAIN: ${SERVICE_FQDN_ZITADEL}
      APP_DOMAIN: ${SERVICE_FQDN_APP}
      LOGIN_DOMAIN: ${SERVICE_FQDN_ZITADELLOGIN}
      # Zitadel blocks webhook targets in private networks (HTTPClient.DenyList, default stays active) — hence the
      # public URL via Caddy, not http://app:3000. The Docker subnet is not predictable.
      WEBHOOK_URL: ${WEBHOOK_URL:-https://${SERVICE_FQDN_APP}/hooks/zitadel}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
      - zitadel-admin:/zitadel/admin:ro
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: prodrigestivill/postgres-backup-local:17-alpine-d257e5d
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      # onduty is the Postgres superuser (bootstrap user of the official
      # image) and thus can read both databases — the backup container needs
      # a single role with access to all DBs listed in POSTGRES_DB, not the
      # restricted Zitadel user.
      POSTGRES_USER: ${POSTGRES_USER:-onduty}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-onduty},${ZITADEL_DB_NAME:-zitadel}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./data/backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  bugsink-data:
  bugsink-bootstrap:
  pgdata:
  zitadel-bootstrap:
  zitadel-admin:

configs:
  init-zitadel-db:
    content: |
      #!/bin/sh
      # Runs once on first start (empty data directory): second DB + dedicated,
      # unprivileged user for Zitadel.
      set -e
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
          CREATE USER "$$ZITADEL_DB_USER" WITH PASSWORD '$$ZITADEL_DB_PASSWORD';
          CREATE DATABASE "$$ZITADEL_DB_NAME" OWNER "$$ZITADEL_DB_USER";
          REVOKE ALL ON DATABASE "$$ZITADEL_DB_NAME" FROM PUBLIC;
          GRANT ALL PRIVILEGES ON DATABASE "$$ZITADEL_DB_NAME" TO "$$ZITADEL_DB_USER";
      EOSQL
