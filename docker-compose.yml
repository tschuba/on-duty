services:
  db:
    image: postgres:17-alpine
    env_file: .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onduty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onduty}
      POSTGRES_DB: ${POSTGRES_DB:-onduty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
